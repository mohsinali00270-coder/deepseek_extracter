<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    #status { color: #6b7280; margin-bottom: 12px; min-height: 18px; }
    button { display: block; width: 100%; margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; text-align: left; }
    button:hover { background: #f6f8fa; }
    button.primary { background: #4d6bfe; color: #fff; border-color: #4d6bfe; font-weight: 600; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { font-size: 11.5px; color: #6b7280; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>📦 DeepSeek Code Exporter</h1>
  <div id="status">Checking page…</div>
  <button class="primary" id="zipAll">Download whole chat as ZIP</button>
  <button id="zipLast">Download last response as ZIP</button>
  <button id="open">Review &amp; rename files…</button>
  <button id="upload">📤 Upload ZIP → text prompt…</button>
  <button id="book">📚 Book tools (PDF book / read a book)…</button>
  <div class="hint">Tip: each DeepSeek answer that contains code also gets its own “Download code as ZIP” button at the end. The 📤 button on the page also opens the ZIP upload.</div>
  <script src="popup.js"></script>
</body>
</html>
